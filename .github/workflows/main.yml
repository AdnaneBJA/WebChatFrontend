name: Continuous Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 2. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 3. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Cache npm dependencies
      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('webchatfrontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 5. Install dependencies and build Angular app
      - name: Install dependencies and build
        working-directory: ./webchatfrontend
        run: |
          npm ci
          npm run build -- --configuration production

      # 6. Deploy to S3
      - name: Deploy to S3
        run: |
          aws s3 sync ./webchatfrontend/dist/webchatfrontend s3://webchatfrontend --delete


    
