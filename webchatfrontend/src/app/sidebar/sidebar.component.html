<html lang="en">
  <body>
    <div class="sidebar">
      <!-- Logo at top -->
      <div class="sidebar-top">
        <svg
          class="image"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M4 11.25C4 10.6977 4.44772 10.25 5 10.25H7C7.55228 10.25 8 
                  10.6977 8 11.25V17.75C8 18.3023 7.55228 18.75 7 18.75H5C4.44772 
                  18.75 4 18.3023 4 17.75V11.25Z"
            fill="currentColor"
          />
          <path
            d="M10 7.25C10 6.69772 10.4477 6.25 11 6.25H13C13.5523 6.25 14 
                  6.69772 14 7.25V17.75C14 18.3023 13.5523 18.75 13 18.75H11C10.4477 
                  18.75 10 18.3023 10 17.75V7.25Z"
            fill="currentColor"
          />
          <path
            d="M16 14.25C16 13.6977 16.4477 13.25 17 13.25H19C19.5523 13.25 
                  20 13.6977 20 14.25V17.75C20 18.3023 19.5523 18.75 19 
                  18.75H17C16.4477 18.75 16 18.3023 16 17.75V14.25Z"
            fill="currentColor"
          />
        </svg>
      </div>

      <!-- Middle items -->
      <div class="sidebar-middle">
        <div
          class="nav-item user-info"
          [ngClass]="{
            active: activePage === 'profile',
            'profile-active': activePage === 'profile'
          }"
          (click)="navigateTo('/profile')"
          data-label="Profile"
        >
          <span class="tooltip">Profile</span>
          <svg
            class="image"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path
              d="M4 22C4 17.5817 7.58172 14 12 14C16.4183 14 20 17.5817 20 22H4ZM13 16.083V20H17.6586C16.9423 17.9735 15.1684 16.4467 13 16.083ZM11 20V16.083C8.83165 16.4467 7.05766 17.9735 6.34141 20H11ZM12 13C8.685 13 6 10.315 6 7C6 3.685 8.685 1 12 1C15.315 1 18 3.685 18 7C18 10.315 15.315 13 12 13ZM12 11C14.2104 11 16 9.21043 16 7C16 4.78957 14.2104 3 12 3C9.78957 3 8 4.78957 8 7C8 9.21043 9.78957 11 12 11Z"
            ></path>
          </svg>
        </div>
        <div
          class="nav-item chat-box"
          [ngClass]="{ active: activePage === 'chats' }"
          (click)="navigateTo('/chatbox')"
          data-label="Chats"
        >
          <span class="tooltip">Chats</span>
          <svg
            class="image"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path
              d="M2 8.99374C2 5.68349 4.67654 3 8.00066 3H15.9993C19.3134 3 22 5.69478 22 8.99374V21H8.00066C4.68659 21 2 18.3052 2 15.0063V8.99374ZM20 19V8.99374C20 6.79539 18.2049 5 15.9993 5H8.00066C5.78458 5 4 6.78458 4 8.99374V15.0063C4 17.2046 5.79512 19 8.00066 19H20ZM14 11H16V13H14V11ZM8 11H10V13H8V11Z"
            ></path>
          </svg>
        </div>
      </div>

      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
