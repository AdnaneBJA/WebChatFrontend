<div class="chat-container">
  <!-- Header -->
  <div class="header">
    <div class="avatar">
      <span>G</span>
    </div>
    <div class="channel-info">
      <span class="channel-name">General</span>
      <span class="online-indicator"></span>
    </div>
  </div>

  <!-- Chat Messages -->
  <div class="chat-messages">
    <div *ngFor="let message of messages" class="message-container">
      <!-- Right aligned (current user) -->
      <div *ngIf="message.isCurrentUser" class="message-right">
        <div class="message-content">
          <div class="message-bubble user-bubble">
            {{ message.message }}
          </div>
          <div class="message-info">
            <span class="message-time">{{ message.time }}</span>
          </div>
        </div>
        <div class="user-info">
          <span class="sender-name">{{ message.username }}</span>
          <img
            [src]="message.avatar"
            alt="avatar"
            class="avatar-circle admin"
            style="object-fit: cover"
          />
        </div>
      </div>

      <!-- Left aligned (other user) -->
      <div *ngIf="!message.isCurrentUser" class="message-left">
        <div class="user-info">
          <img
            [src]="message.avatar"
            alt="avatar"
            class="avatar-circle general"
            style="object-fit: cover"
          />
          <span class="sender-name">{{ message.username }}</span>
        </div>
        <div class="message-content">
          <div class="message-bubble other-bubble">
            {{ message.message }}
          </div>
          <div class="message-info">
            <span class="message-time">{{ message.time }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Message Input -->
  <div class="message-input-container">
    <input
      type="text"
      placeholder="Enter Message..."
      [(ngModel)]="newMessage"
      (keyup.enter)="sendMessage()"
    />
    <div class="input-actions">
      <button class="emoji-button">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
          <line x1="9" y1="9" x2="9.01" y2="9"></line>
          <line x1="15" y1="9" x2="15.01" y2="9"></line>
        </svg>
      </button>
      <button class="attach-button">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.48-8.48l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
          ></path>
        </svg>
      </button>
      <button class="send-button" (click)="sendMessage()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>
